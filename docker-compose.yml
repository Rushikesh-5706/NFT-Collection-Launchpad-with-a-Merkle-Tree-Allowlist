version: '3.8'
services:
  hardhat-node:
    build:
      context: .
      target: contracts
    ports:
      - "8545:8545"
    volumes:
      - ./contracts:/app/contracts
      - ./scripts:/app/scripts
      - ./test:/app/test
    # Command is handled by Dockerfile CMD (entrypoint.sh)
    healthcheck:
      test: [ "CMD", "curl", "-X", "POST", "-H", "Content-Type: application/json", "--data", "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}", "http://localhost:8545" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CONTRACT_ADDRESS=${NEXT_PUBLIC_CONTRACT_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      - NEXT_PUBLIC_RPC_URL=http://localhost:8545
    depends_on:
      hardhat-node:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
